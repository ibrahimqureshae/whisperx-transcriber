name: Build macOS (experimental)

# Builds the thin-launcher portable folder on a real macOS runner and uploads
# it as a workflow artifact. The ML backend still installs on first run via the
# setup wizard — only the GUI shell is built here.
#
# NOTE: the produced app is UNSIGNED. Distributing it to end users requires
# code-signing + notarization with an Apple Developer ID (Gatekeeper blocks
# unsigned downloaded apps). Add APPLE_* secrets and a signing step before
# attaching this to a public release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-macos*"

jobs:
  build:
    runs-on: macos-14          # Apple Silicon (arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller Pillow customtkinter

      - name: Build portable app
        run: bash packaging/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperXTranscriber-macos
          path: dist/release/WhisperXTranscriber-macos.zip
          if-no-files-found: error
